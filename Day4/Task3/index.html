<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Scroll - 10,000 Items</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Virtual Scroll</h1>

      <p>Rendering 10,000 items while only displaying the visible items.</p>

      <div id="virtual-scroll" class="virtual-scroll">
        <div id="scroll-content" class="scroll-content"></div>
      </div>

      <p id="render-info" class="render-info">Loading...</p>
    </main>

    <script src="main.js"></script>
  </body>
</html>
