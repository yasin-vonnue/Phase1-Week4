<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndexedDB Offline Kanban</title>

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header>
      <h1>IndexedDB Offline Kanban</h1>

      <p>Kanban data is persisted using IndexedDB.</p>

      <p id="connection-status" aria-live="polite">Checking connection...</p>

      <button type="button" id="sync-button">Sync Changes</button>

      <p id="sync-status" aria-live="polite"></p>
    </header>

    <main>
      <section class="kanban">
        <div class="kanban-column">
          <h2>Todo</h2>

          <button type="button" class="add-card" data-status="todo">
            Add Card
          </button>

          <div class="kanban-list" data-status="todo"></div>
        </div>

        <div class="kanban-column">
          <h2>In Progress</h2>

          <button type="button" class="add-card" data-status="progress">
            Add Card
          </button>

          <div class="kanban-list" data-status="progress"></div>
        </div>

        <div class="kanban-column">
          <h2>Done</h2>

          <button type="button" class="add-card" data-status="done">
            Add Card
          </button>

          <div class="kanban-list" data-status="done"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
